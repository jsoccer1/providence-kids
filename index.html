<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find My Class · Providence Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-public">

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="https://www.pray.org/wp-content/uploads/2023/04/cropped-logoweb-1-270x270.png"
             alt="Providence Church logo" class="brand-logo"
             onerror="this.style.display='none'">
        <span class="brand-text">
          <span class="brand-name">Providence Kids</span>
          <span class="brand-sub">Providence Church · Raleigh, NC</span>
        </span>
      </a>
      <nav class="header-nav">
        <a class="btn btn-ghost" href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="public-main">
    <section class="hero">
      <div class="container hero-inner">
        <p class="eyebrow">Sunday Morning Check-In</p>
        <h1 class="hero-title">Find your child’s class</h1>
        <p class="hero-lede">Enter your child’s name and we’ll point you to the right room.</p>

        <div class="lookup-card">
          <label class="field-label" for="nameInput">Child’s name</label>
          <div class="lookup-row">
            <input id="nameInput" type="text" placeholder="e.g. John Smith" autocomplete="off">
            <button id="findClassBtn" class="btn btn-primary">Find My Class</button>
          </div>
          <div id="lookupResult" class="lookup-result" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section class="class-list-section">
      <div class="container">
        <h2 class="section-title">Our classrooms</h2>
        <div id="publicClassList"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Providence Church · 6339 Glenwood Avenue, Raleigh, NC 27612</p>
      <p class="footer-note">Demo application — sample data only.</p>
    </div>
  </footer>

  <!-- Supabase client (UMD). config.js is generated at deploy time or created locally; if absent, the app runs in offline demo mode. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
