<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Providence Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-admin">

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="https://www.pray.org/wp-content/uploads/2023/04/cropped-logoweb-1-270x270.png"
             alt="Providence Church logo" class="brand-logo"
             onerror="this.style.display='none'">
        <span class="brand-text">
          <span class="brand-name">Providence Kids</span>
          <span class="brand-sub">Admin · Class Definitions</span>
        </span>
      </a>
      <nav class="header-nav">
        <a class="btn btn-ghost" href="index.html">Class Finder</a>
      </nav>
    </div>
  </header>

  <main class="container admin-main">

    <div class="admin-toolbar">
      <div>
        <h1 class="page-title">Classroom definitions</h1>
        <p class="page-sub" id="adminSummary"></p>
        <p class="page-sub" id="localModeNote" hidden>Offline demo mode — changes are saved to this browser only (no Supabase connected).</p>
      </div>
      <div class="toolbar-actions">
        <button id="addClassroomBtn" class="btn btn-primary">+ Add Classroom</button>
      </div>
    </div>

    <div id="adminClassList"></div>

  </main>

  <!-- Classroom edit/create modal -->
  <div class="modal-overlay" id="classroomModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="classroomModalTitle">Edit Classroom</h3>
        <button class="modal-close" data-close-modal="classroomModal" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="classroomForm">
          <input type="hidden" id="classroomId">
          <div class="form-grid">
            <div class="field field-wide">
              <label class="field-label" for="classroomName">Name</label>
              <input id="classroomName" type="text" placeholder="e.g. Nursery, Twos, Threes">
            </div>
            <div class="field">
              <label class="field-label" for="classroomDay">Day</label>
              <select id="classroomDay">
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="classroomTime">Service Time</label>
              <input id="classroomTime" type="text" placeholder="e.g. 9:30 AM" list="timeSuggestions">
              <datalist id="timeSuggestions">
                <option value="8:00 AM">
                <option value="9:30 AM">
                <option value="11:10 AM">
              </datalist>
            </div>
            <div class="field">
              <label class="field-label" for="classroomRoom">Room number</label>
              <input id="classroomRoom" type="text" placeholder="e.g. 110">
            </div>
            <div class="field">
              <label class="field-label" for="classroomNote">Note <span style="text-transform:none;font-weight:400;">(optional)</span></label>
              <input id="classroomNote" type="text" placeholder="e.g. younger, older">
            </div>
            <div class="field">
              <label class="field-label" for="classroomMin">Birthdate range starts</label>
              <input id="classroomMin" type="date">
            </div>
            <div class="field">
              <label class="field-label" for="classroomMax">Birthdate range ends</label>
              <input id="classroomMax" type="date">
              <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:0.85rem;color:var(--ink-soft);font-weight:400;">
                <input type="checkbox" id="classroomNoMax" style="width:auto;"> No upper limit (newest babies)
              </label>
            </div>
            <div class="field field-wide">
              <label class="field-label">Color</label>
              <div class="color-swatches" id="colorSwatches"></div>
            </div>
          </div>
          <p class="form-error" id="classroomFormError" hidden></p>
          <div class="modal-actions modal-actions-split">
            <button type="button" id="deleteClassroomBtn" class="btn btn-danger">Delete</button>
            <div class="modal-actions-right">
              <button type="button" class="btn btn-ghost" data-close-modal="classroomModal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
